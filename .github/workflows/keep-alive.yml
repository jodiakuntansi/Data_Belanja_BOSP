name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app (this queries Supabase, which counts as activity)
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://data-belanja-bosp.vercel.app/api/schools
